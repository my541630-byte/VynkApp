<!DOCTYPE html>
<html>
<head>
<title>VynkApp Login Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="font-family:sans-serif; text-align:center; padding:40px;">

<h2>VynkApp Login</h2>

<input id="email" type="email" placeholder="Email likho" style="padding:12px; width:90%; margin:5px;"><br>
<input id="password" type="password" placeholder="Password likho" style="padding:12px; width:90%; margin:5px;"><br>

<button onclick="signup()" style="padding:12px 20px; margin:5px;">Sign Up</button>
<button onclick="login()" style="padding:12px 20px; margin:5px;">Login</button>

<p id="msg"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCioypepHB7ksvvy-241mwzW4iDJSjFUS4",
  authDomain: "vynkapp-10da0.firebaseapp.com",
  projectId: "vynkapp-10da0",
  storageBucket: "vynkapp-10da0.firebasestorage.app",
  messagingSenderId: "85561384540",
  appId: "1:85561384540:web:bcb362b7898f06181d9099",
  measurementId: "G-ZQ46TEC5YL"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.signup = async function() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  try {
    await createUserWithEmailAndPassword(auth, email, password);
    document.getElementById("msg").innerText = "Sign Up Ho Gaya! ✅ Ab Login Dabao";
  } catch(e) {
    document.getElementById("msg").innerText = e.message;
  }
}

window.login = async function() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  try {
    await signInWithEmailAndPassword(auth, email, password);
    document.getElementById("msg").innerText = "Login Ho Gaya! 🎉 Welcome to VynkApp";
  } catch(e) {
    document.getElementById("msg").innerText = e.message;
  }
}
</script>

</body>
  </html>
