<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VynkApp</title>
<style>
body{margin:0;background:#ffecec;font-family:sans-serif;text-align:center}
input{width:90%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
.btn{width:95%;padding:12px;margin:6px 0;background:#ff4757;color:white;border:none;border-radius:8px;font-size:16px}
.card{background:white;margin:10px;padding:15px;border-radius:12px;text-align:left}
</style>
</head>
<body>
<div id="loginBox" style="background:#ff4757;color:white;padding:20px;min-height:100vh">
<h1 style="margin-top:40px">❤️ Vynk</h1>
<p>Apne Doston Se Judo</p>
<div style="background:white;color:black;padding:20px;border-radius:15px">
<h3>Login / Sign Up</h3>
<input id="name" placeholder="Apna Naam Likho">
<input id="email" placeholder="Email / Mobile Number">
<input id="pass" type="password" placeholder="Password">
<button class="btn" onclick="signup()">Sign Up - Naya Account</button>
<button class="btn" style="background:#2ed573" onclick="login()">Login - Andar Jao</button>
<p id="msg" style="color:red"></p>
</div>
</div>
<div id="feedBox" style="display:none;padding:15px">
<h2>❤️ Vynk Feed</h2>
<p id="welcome"></p>
<input id="postText" placeholder="Kuch likho...">
<button class="btn" onclick="addPost()">Post Karo</button>
<div id="posts"></div>
<button class="btn" style="background:#57606f" onclick="logout()">Logout</button>
</div>
<script>
function signup(){
var n=document.getElementById('name').value;
var e=document.getElementById('email').value;
var p=document.getElementById('pass').value;
if(!n||!e||!p){document.getElementById('msg').innerText='Sab khane bharo!';return;}
localStorage.setItem('vynk_user', JSON.stringify({name:n,email:e,pass:p}));
alert('Account Ban Gaya! Ab Login Dabao');
}
function login(){
var e=document.getElementById('email').value;
var p=document.getElementById('pass').value;
var saved=JSON.parse(localStorage.getItem('vynk_user')||'null');
if(saved && saved.email==e && saved.pass==p){
document.getElementById('loginBox').style.display='none';
document.getElementById('feedBox').style.display='block';
document.getElementById('welcome').innerText='Welcome, '+saved.name+'!';
showPosts();
} else {
document.getElementById('msg').innerText='Email ya Password Ghalat Hai. Pehle Sign Up Karo.';
}
}
function addPost(){
var t=document.getElementById('postText').value;
if(!t) return;
var posts=JSON.parse(localStorage.getItem('vynk_posts')||'[]');
posts.unshift(t);
localStorage.setItem('vynk_posts', JSON.stringify(posts));
document.getElementById('postText').value='';
showPosts();
}
function showPosts(){
var posts=JSON.parse(localStorage.getItem('vynk_posts')||'[]');
var html='';
for(var i=0;i<posts.length;i++){ html+='<div class="card">'+posts[i]+'</div>'; }
document.getElementById('posts').innerHTML=html || '<p>Abhi koi post nahi hai.</p>';
}
function logout(){
document.getElementById('feedBox').style.display='none';
document.getElementById('loginBox').style.display='block';
}
</script>
</body>
                  </html>
