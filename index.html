<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vynk</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f0f;color:#fff;padding-bottom:70px}
.top{position:sticky;top:0;background:#000;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;z-index:10;border-bottom:1px solid #222}
.logo{font-size:26px;font-weight:900;color:#00ff88}
.top button{background:#222;color:#fff;border:0;padding:8px 14px;border-radius:20px}
.post-box{background:#1a1a1a;margin:10px;padding:12px;border-radius:12px}
.post-box input{width:100%;background:#222;border:0;padding:12px;border-radius:20px;color:#fff;outline:none}
.post-box button{margin-top:10px;background:#00ff88;color:#000;border:0;padding:10px 18px;border-radius:20px;font-weight:700;width:100%}
.card{background:#1a1a1a;margin:10px;padding:12px;border-radius:12px}
.card .head{display:flex;justify-content:space-between;align-items:center}
.card b{color:#00ff88}
.card p{margin:10px 0;line-height:1.5;font-size:15px}
.followBtn{background:#00ff88;color:#000;border:0;padding:6px 12px;border-radius:20px;font-weight:700;font-size:12px}
.followBtn.off{background:#222;color:#fff}
.actions{display:flex;justify-content:space-between;margin-top:10px;border-top:1px solid #333;padding-top:10px}
.actions button{background:none;border:0;color:#ccc;font-size:14px}
.actions button.liked{color:#ff3b5c}
.comments{margin-top:10px}
.comments input{width:100%;background:#222;border:0;padding:10px;border-radius:20px;color:#fff;outline:none;margin-top:8px}
.commentItem{background:#222;padding:8px 10px;border-radius:10px;margin-top:6px;font-size:13px}
.login{padding:30px 20px;text-align:center}
.login h1{font-size:44px;color:#00ff88;margin-bottom:10px}
.login input{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:0;background:#222;color:#fff;outline:none}
.login button{width:100%;padding:14px;background:#00ff88;border:0;border-radius:10px;font-weight:800;margin-top:10px}
.hidden{display:none}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;display:flex;justify-content:space-around;padding:12px;border-top:1px solid #222;z-index:20}
.nav button{background:none;border:0;color:#fff;font-size:14px}
.profileBox{background:#1a1a1a;margin:10px;padding:15px;border-radius:12px;text-align:center}
.profileBox h2{color:#00ff88}
.loadingScreen{padding:80px 20px;text-align:center}
.loadingScreen h1{font-size:44px;color:#00ff88}
.spinner{width:50px;height:50px;border:5px solid #222;border-top:5px solid #00ff88;border-radius:50%;margin:25px auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- LOADING - Pehle yehi dikhega -->
<div id="loadingScreen" class="loadingScreen">
  <h1>Vynk</h1>
  <div class="spinner"></div>
  <p style="color:#aaa">Loading... Apni Duniya Khul Rahi Hai</p>
</div>

<!-- LOGIN -->
<div id="loginScreen" class="login hidden">
  <h1>Vynk</h1>
  <p style="color:#aaa;margin-bottom:15px">Apni Duniya, Apne Log</p>
  <input id="nameInput" placeholder="Apna Naam">
  <input id="emailInput" placeholder="Email">
  <input id="passInput" type="password" placeholder="Password">
  <button onclick="doLogin()">Login / Account Banao</button>
  <p id="loginMsg" style="margin-top:10px;color:#ff5555"></p>
</div>

<!-- HOME -->
<div id="homeScreen" class="hidden">
  <div class="top">
    <div class="logo">Vynk</div>
    <button onclick="doLogout()">Logout</button>
  </div>
  <div id="profileArea"></div>
  <div class="post-box">
    <input id="postText" placeholder="Kya soch rahe ho?">
    <button onclick="addPost()">Post Karo</button>
  </div>
  <div id="feed"></div>
</div>

<div class="nav hidden" id="bottomNav">
  <button onclick="showHome()">🏠 Home</button>
  <button onclick="showProfile()">👤 Profile</button>
  <button onclick="showHome()">💬 Chat</button>
  <button onclick="doLogout()">🚪 Logout</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, updateDoc, arrayUnion, arrayRemove, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCioypepHB7ksvvy-241mwzW4iDJSjFUS4",
  authDomain: "vynkapp-10da0.firebaseapp.com",
  projectId: "vynkapp-10da0",
  storageBucket: "vynkapp-10da0.firebasestorage.app",
  messagingSenderId: "85561384540",
  appId: "1:85561384540:web:cf91923827a801b31d9099",
  measurementId: "G-W4CLNK8PTS"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
let currentUser = null;
let myFollowing = [];

onAuthStateChanged(auth, async (user)=>{
  // Pehle Loading ko band karo
  document.getElementById('loadingScreen').classList.add('hidden');
  if(user){
    currentUser = user;
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('homeScreen').classList.remove('hidden');
    document.getElementById('bottomNav').classList.remove('hidden');
    const myRef = doc(db,"users",user.uid);
    const snap = await getDoc(myRef);
    if(!snap.exists()){
      await setDoc(myRef,{name:user.displayName||"User", following:[], followers:[]});
    } else {
      myFollowing = snap.data().following || [];
    }
    loadFeed();
    loadProfile();
  } else {
    currentUser = null;
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('homeScreen').classList.add('hidden');
    document.getElementById('bottomNav').classList.add('hidden');
  }
});

window.doLogin = async ()=>{
  const name = document.getElementById('nameInput').value;
  const email = document.getElementById('emailInput').value;
  const pass = document.getElementById('passInput').value;
  if(!email || !pass){ document.getElementById('loginMsg').innerText = "Email aur Password likho"; return; }
  try{ await signInWithEmailAndPassword(auth, email, pass); }
  catch(e){
    try{
      const u = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(u.user, {displayName: name || "User"});
      await setDoc(doc(db,"users",u.user.uid),{name:name||"User", following:[], followers:[]});
    } catch(e2){ document.getElementById('loginMsg').innerText = e2.message; }
  }
};
window.doLogout = ()=> signOut(auth);
window.showHome = ()=>{ window.scrollTo({top:0, behavior:'smooth'}); };
window.showProfile = ()=>{ window.scrollTo({top:0, behavior:'smooth'}); };

window.addPost = async ()=>{
  const text = document.getElementById('postText').value;
  if(!text) return;
  await addDoc(collection(db,"posts"),{ text, name: currentUser.displayName || "User", uid: currentUser.uid, createdAt: serverTimestamp(), likes: [], comments: [] });
  document.getElementById('postText').value = "";
};

function loadProfile(){
  onSnapshot(doc(db,"users",currentUser.uid),(d)=>{
    if(!d.exists()) return;
    const u = d.data();
    myFollowing = u.following || [];
    document.getElementById('profileArea').innerHTML = `<div class="profileBox"><h2>${u.name}</h2><p style="color:#aaa;margin-top:6px">Following: ${u.following?.length||0} • Followers: ${u.followers?.length||0}</p><p style="font-size:13px;color:#888;margin-top:4px">Vynk • Apni Duniya</p></div>`;
  });
}

function loadFeed(){
  const q = query(collection(db,"posts"), orderBy("createdAt","desc"));
  onSnapshot(q,(snap)=>{
    let html = "";
    snap.forEach(d=>{
      const p = d.data();
      const id = d.id;
      const isMine = p.uid === currentUser.uid;
      const isFollowing = myFollowing.includes(p.uid);
      const isLiked = (p.likes||[]).includes(currentUser.uid);
      let commentsHtml = "";
      (p.comments||[]).forEach(c=>{
        commentsHtml += `<div class="commentItem"><b>${c.name}:</b> ${c.text}</div>`;
      });
      html += `<div class="card">
        <div class="head">
          <b>${p.name||"User"}</b>
          ${isMine ? `<span style="font-size:12px;color:#888">Tumhari Post</span>` : `<button class="followBtn ${isFollowing?'off':''}" onclick="toggleFollow('${p.uid}','${p.name}')">${isFollowing?'Unfollow':'Follow'}</button>`}
        </div>
        <p>${p.text||""}</p>
        <div class="actions">
          <button class="${isLiked?'liked':''}" onclick="toggleLike('${id}')">❤️ Like (${(p.likes||[]).length})</button>
          <button onclick="focusComment('${id}')">💬 Comment (${(p.comments||[]).length})</button>
          <button onclick="sharePost('${p.text}')">↗️ Share</button>
        </div>
        <div class="comments" id="c-${id}">${commentsHtml}<input id="inp-${id}" placeholder="Comment likho..." onkeydown="if(event.key==='Enter') addComment('${id}')"></div>
      </div>`;
    });
    document.getElementById('feed').innerHTML = html || "<p style='text-align:center;color:#888;padding:20px'>Abhi koi post nahi hai, pehli post tum karo</p>";
  });
}

window.toggleLike = async (postId)=>{
  const ref = doc(db,"posts",postId);
  const snap = await getDoc(ref);
  const likes = snap.data().likes || [];
  if(likes.includes(currentUser.uid)){
    await updateDoc(ref,{likes: arrayRemove(currentUser.uid)});
  } else {
    await updateDoc(ref,{likes: arrayUnion(currentUser.uid)});
  }
};

window.focusComment = (id)=>{ document.getElementById('inp-'+id).focus(); };

window.addComment = async (postId)=>{
  const inp = document.getElementById('inp-'+postId);
  const text = inp.value.trim();
  if(!text) return;
  const ref = doc(db,"posts",postId);
  await updateDoc(ref,{comments: arrayUnion({name: currentUser.displayName||"User", text})});
  inp.value = "";
};

window.toggleFollow = async (targetUid, targetName)=>{
  if(targetUid === currentUser.uid) return;
  const myRef = doc(db,"users",currentUser.uid);
  const targetRef = doc(db,"users",targetUid);
  if(myFollowing.includes(targetUid)){
    await updateDoc(myRef,{following: arrayRemove(targetUid)});
    await updateDoc(targetRef,{followers: arrayRemove(currentUser.uid)});
  } else {
    await updateDoc(myRef,{following: arrayUnion(targetUid)});
    const tSnap = await getDoc(targetRef);
    if(!tSnap.exists()){ await setDoc(targetRef,{name:targetName, following:[], followers:[currentUser.uid]}); }
    else { await updateDoc(targetRef,{followers: arrayUnion(currentUser.uid)}); }
  }
};

window.sharePost = async (text)=>{
  const shareText = "Vynk par dekho: " + text + " - Download Vynk App";
  if(navigator.share){
    try{ await navigator.share({title:"Vynk", text: shareText, url: location.href}); }catch(e){}
  } else {
    navigator.clipboard.writeText(shareText);
    alert("Link copy ho gaya! Ab WhatsApp par paste kar do");
  }
};
</script>
</body>
  </html>
