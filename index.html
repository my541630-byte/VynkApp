<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VynkApp</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:0}
.header{background:#111;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;gap:8px;flex-wrap:wrap}
.header b{font-size:22px;color:#ffcc00}
.header span{font-size:13px;color:#ccc}
.search-input{flex:1;min-width:120px;background:#222;color:#fff;border:0;padding:9px 12px;border-radius:20px;font-size:14px;outline:none}
.login-box{background:#111;margin:20px;padding:20px;border-radius:15px;text-align:center}
.login-box h1{color:#ffcc00;font-size:30px;margin:0}
.login-box p{color:#aaa;font-size:14px}
.login-box input{width:100%;background:#222;color:#fff;border:0;padding:13px;border-radius:10px;margin-bottom:10px;box-sizing:border-box;font-size:16px}
.login-btn{width:100%;background:#25D366;color:#fff;border:0;padding:13px;border-radius:10px;font-size:17px;font-weight:bold;margin-top:5px}
.post-box{background:#111;margin:10px;padding:12px;border-radius:12px}
.post-box input, .post-box textarea{width:100%;background:#222;color:#fff;border:0;padding:10px;border-radius:8px;margin-bottom:8px;box-sizing:border-box}
.post-box textarea{height:70px}
.row{display:flex;gap:8px;align-items:center}
.plus-btn{background:#222;color:#ffcc00;font-size:24px;width:45px;height:42px;border:0;border-radius:8px}
.post-btn{flex:1;background:#25D366;color:#fff;border:0;padding:12px;border-radius:8px;font-size:16px;font-weight:bold}
#preview img, #preview video{width:100%;border-radius:10px;margin-top:8px}
#feed{padding:10px}
.post{background:#111;padding:12px;border-radius:12px;margin-bottom:10px}
.post-top{display:flex;justify-content:space-between;align-items:center}
.post-top h3{margin:0;color:#ffcc00}
.follow-btn{background:#ffcc00;color:#000;border:0;padding:7px 14px;border-radius:20px;font-weight:bold}
.follow-btn.following{background:#222;color:#fff}
.post p{margin:8px 0;white-space:pre-wrap}
.post img, .post video{width:100%;border-radius:10px;margin-top:8px}
.actions{display:flex;gap:8px;margin-top:10px;border-top:1px solid #222;padding-top:10px}
.actions button{flex:1;background:#222;color:#fff;border:0;padding:9px;border-radius:8px;font-size:14px}
.actions button.liked{background:#ff3b30;color:#fff}
.actions button.delete-btn{color:#ff6b6b}
.comment-box{display:none;margin-top:10px}
.comment-box input{width:100%;background:#222;color:#fff;border:0;padding:9px;border-radius:8px;box-sizing:border-box}
.comment-list{margin-top:8px;font-size:14px}
.comment-list div{background:#222;padding:7px 10px;border-radius:8px;margin-bottom:5px}
.logout{color:#ff3b30;font-size:13px;background:none;border:0}
</style>
</head>
<body>

<div id="loginPage" style="display:none">
  <div class="login-box">
    <h1>Vynk</h1>
    <p>Drama Lovers ki Apni Duniya</p>
    <input id="loginName" placeholder="Apna Naam likho">
    <input id="loginEmail" type="email" placeholder="Gmail likho - jaise ali@gmail.com">
    <input id="loginPass" type="password" placeholder="Password likho">
    <button class="login-btn" onclick="doLogin()">Login / Account Banao</button>
    <p style="font-size:12px;margin-top:12px">Gmail aur Password sirf tum ko pata hoga, kisi aur ko nahi dikhega. Post par sirf Naam dikhega.</p>
  </div>
</div>

<div id="mainApp" style="display:none">
  <div class="header"><b>Vynk</b><input id="searchInput" class="search-input" placeholder="🔍 Dost ka Naam / Drama dhoondo..." oninput="renderPosts()"><span id="welcomeText"></span> <button class="logout" onclick="doLogout()">Logout</button></div>
  <div class="post-box">
    <input id="dramaName" placeholder="Drama ka Naam - likhna chaho to likho">
    <textarea id="postText" placeholder="Is bare me kuch likho..."></textarea>
    <input type="file" id="mediaInput" accept="image/*,video/*" style="display:none" onchange="showPreview()">
    <div id="preview"></div>
    <div class="row">
      <button class="plus-btn" onclick="document.getElementById('mediaInput').click()">+</button>
      <button class="post-btn" onclick="addPost()">Post Karo</button>
    </div>
  </div>
  <div id="feed"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
// ===== TUMHARI VYNKAPP FIREBASE CONFIG =====
const firebaseConfig = {
  apiKey: "AIzaSyCioypepHB7ksvvy-241mwzW4iDJSjFUS4",
  authDomain: "vynkapp-10da0.firebaseapp.com",
  projectId: "vynkapp-10da0",
  storageBucket: "vynkapp-10da0.firebasestorage.app",
  messagingSenderId: "85561384540",
  appId: "1:85561384540:web:cf91923827a801b31d9099",
  measurementId: "G-W4CLNK8PTS",
  databaseURL: "https://vynkapp-10da0-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
let dbRef = firebase.database().ref('vynk_posts');
let useFirebase = true;

let posts = [];
let currentUser = localStorage.getItem('vynk_user') || '';
let previewData = '';
let previewIsVideo = false;

if(currentUser){ showMain(); } else { document.getElementById('loginPage').style.display='block'; }

function doLogin(){
  let name = document.getElementById('loginName').value.trim();
  let email = document.getElementById('loginEmail').value.trim();
  let pass = document.getElementById('loginPass').value.trim();
  if(!name || !email || !pass){ alert('Naam, Gmail aur Password teeno likho!'); return; }
  if(!email.includes('@')){ alert('Sahi Gmail likho!'); return; }
  let users = JSON.parse(localStorage.getItem('vynk_users') || '{}');
  if(users[email]){
    if(users[email].pass !== pass){ alert('Password ghalat hai!'); return; }
    currentUser = users[email].name;
  } else {
    users[email] = {name: name, pass: pass};
    localStorage.setItem('vynk_users', JSON.stringify(users));
    currentUser = name;
    alert('Welcome ' + name + '! Tumhara Account ban gaya!');
  }
  localStorage.setItem('vynk_user', currentUser);
  showMain();
}
function showMain(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('mainApp').style.display='block';
  document.getElementById('welcomeText').innerText='Hi, '+currentUser;
  dbRef.on('value', function(snapshot){
    let val = snapshot.val();
    posts = [];
    if(val){
      let keys = Object.keys(val).reverse();
      keys.forEach(function(k){
        let p = val[k];
        p._key = k;
        if(!p.comments) p.comments = [];
        posts.push(p);
      });
    }
    renderPosts();
  });
}
function doLogout(){ localStorage.removeItem('vynk_user'); location.reload(); }
function showPreview(){
  let file=document.getElementById('mediaInput').files[0];
  if(!file) return;
  if(file.size > 10*1024*1024){ alert('10 MB se choti file lagao!'); document.getElementById('mediaInput').value=''; return; }
  if(file.type.startsWith('video')){
    let video=document.createElement('video'); video.preload='metadata';
    video.onloadedmetadata=function(){ if(video.duration>30){ alert('Video 30 second se lambi hai!'); document.getElementById('mediaInput').value=''; return; } readFile(file); };
    video.src=URL.createObjectURL(file);
  } else { readFile(file); }
}
function readFile(file){
  let reader=new FileReader();
  reader.onload=function(e){ previewData=e.target.result; previewIsVideo=file.type.startsWith('video'); document.getElementById('preview').innerHTML=previewIsVideo?'<video src="'+previewData+'" controls></video>':'<img src="'+previewData+'">'; };
  reader.readAsDataURL(file);
}
function renderPosts(){
  let feed=document.getElementById('feed'); feed.innerHTML='';
  let q = (document.getElementById('searchInput') ? document.getElementById('searchInput').value.trim().toLowerCase() : '');
  posts.forEach(function(post,index){
    if(q){
      let hay = ((post.name||'')+' '+(post.text||'')).toLowerCase();
      if(!hay.includes(q)) return;
    }
    let div=document.createElement('div'); div.className='post';
    let mediaHTML=''; if(post.media){ if(post.isVideo) mediaHTML='<video src="'+post.media+'" controls></video>'; else mediaHTML='<img src="'+post.media+'">'; }
    let commentsHTML=(post.comments||[]).map(c=>'<div>'+c+'</div>').join('');
    div.innerHTML='<div class="post-top"><h3>'+post.name+'</h3><button class="follow-btn '+(post.follow?'following':'')+'" onclick="toggleFollow('+index+')">'+(post.follow?'Following ✓':'Follow')+'</button></div>'+(post.text?'<p>'+post.text+'</p>':'')+mediaHTML+'<div class="actions"><button class="'+(post.liked?'liked':'')+'" onclick="likePost('+index+')">❤️ Like <span>'+post.likes+'</span></button><button onclick="toggleComment(this)">💬 Comment</button><button class="delete-btn" onclick="deletePost('+index+')">🗑️ Delete</button></div><div class="comment-box"><input placeholder="Comment likho..." onkeydown="if(event.key===\'Enter\'){addComment('+index+',this)}"><div class="comment-list">'+commentsHTML+'</div></div>';
    feed.appendChild(div);
  });
  if(feed.innerHTML==='' && q){ feed.innerHTML='<p style="text-align:center;color:#aaa">Koi result nahi mila: '+q+'</p>'; }
}
function addPost(){
  let nameInput=document.getElementById('dramaName').value;
  let name=nameInput ? nameInput+' - '+currentUser : currentUser;
  let text=document.getElementById('postText').value;
  let file=document.getElementById('mediaInput').files[0];
  if(!text && !file && !nameInput){ alert('Pehle kuch likho!'); return; }
  let newPost={name:name,text:text,media:previewData||'',isVideo:previewIsVideo,likes:0,liked:false,follow:false,comments:[],time:Date.now()};
  dbRef.push(newPost);
  document.getElementById('dramaName').value=''; document.getElementById('postText').value=''; document.getElementById('mediaInput').value=''; document.getElementById('preview').innerHTML=''; previewData=''; previewIsVideo=false;
}
function toggleFollow(index){ posts[index].follow=!posts[index].follow; if(posts[index]._key) dbRef.child(posts[index]._key).update({follow:posts[index].follow}); renderPosts(); }
function likePost(index){ if(posts[index].liked){posts[index].liked=false;posts[index].likes--;} else {posts[index].liked=true;posts[index].likes++;} if(posts[index]._key) dbRef.child(posts[index]._key).update({liked:posts[index].liked,likes:posts[index].likes}); renderPosts(); }
function toggleComment(btn){ let box=btn.closest('.post').querySelector('.comment-box'); box.style.display=box.style.display==='block'?'none':'block'; }
function addComment(index,input){ if(!input.value) return; posts[index].comments.push(currentUser+': '+input.value); if(posts[index]._key) dbRef.child(posts[index]._key).update({comments:posts[index].comments}); renderPosts(); }
function deletePost(index){
  if(confirm('Ye post delete kar dun?')){
    if(posts[index]._key){ dbRef.child(posts[index]._key).remove(); }
  }
}
</script>
</body>
</html>
